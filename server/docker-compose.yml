version: '3.8'

services:
  # Nginx Reverse Proxy with 500M body size and WebSocket proxying
  nginx:
    image: nginx:alpine
    container_name: contentfarm_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media_storage:/var/www/media:ro
    depends_on:
      - backend
      - frontend

  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: contentfarm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-content_farm_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Redis 7 Cache & Task Broker
  redis:
    image: redis:7-alpine
    container_name: contentfarm_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # FastAPI Async Backend Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: contentfarm_backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-farm_admin}:${POSTGRES_PASSWORD:-SuperSecretPass2026!}@postgres:5432/${POSTGRES_DB:-content_farm_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AGENT_SECRET: ${AGENT_SECRET:-cf_agent_sec_994821a8f}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
    volumes:
      - ./app:/app/app
      - ./media_storage:/app/media_storage
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  # Celery Worker for Distributed Task Execution
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: contentfarm_celery_worker
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=8
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-farm_admin}:${POSTGRES_PASSWORD:-SuperSecretPass2026!}@postgres:5432/${POSTGRES_DB:-content_farm_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
    volumes:
      - ./app:/app/app
      - ./media_storage:/app/media_storage
    depends_on:
      - backend
      - redis

  # Celery Beat Scheduler (Timezone Aware Cron triggers)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: contentfarm_celery_beat
    restart: always
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-farm_admin}:${POSTGRES_PASSWORD:-SuperSecretPass2026!}@postgres:5432/${POSTGRES_DB:-content_farm_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
    volumes:
      - ./app:/app/app
    depends_on:
      - backend
      - redis

  # Frontend Web UI (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contentfarm_frontend
    restart: always
    ports:
      - "3000:80"

volumes:
  pgdata:
  redisdata:
